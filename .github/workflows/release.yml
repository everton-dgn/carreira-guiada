name: Release

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: ID da CI de push aprovada na main
        type: string
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Publish the version from verified CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: python3 -m scripts.maintainers.release publish

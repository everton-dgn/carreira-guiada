name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select required checks
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.5'
          python-version: '3.13'
      - name: Compare event commits conservatively
        id: select
        run: uv run --no-project python scripts/maintainers/ci_checks.py select
  documentation:
    name: publication and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.5'
          python-version: '3.13'
      - name: Check exact publication index
        run: uv run --no-project python scripts/check_publication.py --staged
      - name: Check actual project and lock release versions
        run: uv run --no-project python scripts/maintainers/ci_checks.py versions
      - name: Check links, skill mirrors, publication, release and CI contracts
        run: >-
          uv run --no-project python -m unittest
          tests.test_job_package tests.test_publication tests.test_release tests.test_ci_checks
  tests:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check publication contents
        run: uv run --locked python scripts/check_publication.py --staged
      - name: Run tests without real accounts
        run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
      - name: Check clean start
        run: |
          ./job start --json
          test ! -e .job
          git diff --exit-code
  browser:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: browser (isolated fictional services)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.5'
          python-version: '3.13'
      - run: uv sync --locked --group browser
      - run: uv run --locked --group browser playwright install --with-deps chromium
      - run: uv run --locked --group browser python -m unittest discover -s tests/browser -p "test_*.py"
  quality:
    name: quality
    if: always()
    needs: [plan, documentation, tests, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.5'
          python-version: '3.13'
      - name: Require every selected check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: uv run --no-project python scripts/maintainers/ci_checks.py quality

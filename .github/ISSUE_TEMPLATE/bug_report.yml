name: Relatar um problema
description: Conte o que impediu você de continuar, usando dados fictícios.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Não envie currículo, dados pessoais, credenciais ou mensagens reais. Vulnerabilidades devem ser relatadas pelo canal privado indicado em SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: O que aconteceu?
      description: Conte o que esperava e o que apareceu no lugar.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir com dados fictícios?
      description: Descreva os passos, sem anexar arquivos pessoais ou copiar o perfil privado.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Qual ambiente você usou?
      description: Informe sistema, aplicativo de IA e versão do Job, se souber.
  - type: checkboxes
    id: privacy
    attributes:
      label: Conferência antes de publicar
      options:
        - label: Removi dados pessoais e segredos deste relato.
          required: true

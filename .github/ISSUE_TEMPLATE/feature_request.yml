name: Sugerir uma melhoria
description: Explique a dificuldade e o resultado que ajudaria você.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual dificuldade você quer resolver?
      description: Use um exemplo fictício, sem informações pessoais.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Como seria uma solução útil?
      description: Pode descrever com suas palavras; não precisa propor código.
    validations:
      required: true

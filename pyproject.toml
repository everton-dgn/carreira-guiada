[project]
name = "carreira-guiada"
version = "0.5.1"
description = "Automatize a busca de emprego, o currículo e as candidaturas com seu modelo de IA"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5",
  "python-docx>=1.1",
  "reportlab>=4.2",
]

[tool.uv]
package = false

[tool.carreira-release]
prerelease = false

[dependency-groups]
docs = ["pillow>=11"]

[project]
name = "carreira-guiada"
version = "0.22.0"
description = "Automatize a busca de emprego, o currículo e as candidaturas com seu modelo de IA"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "rich>=15,<16",
]

[tool.uv]
package = false

[tool.carreira-release]
prerelease = false

[dependency-groups]
browser = [
    "playwright>=1.58,<2",
]
docs = ["pillow>=11"]

[project]
name = "carreira-guiada"
version = "0.1.0"
description = "Busca de vagas e preenchimento de candidaturas guiados por IA, com menos trabalho manual"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5",
  "python-docx>=1.1",
  "reportlab>=4.2",
]

[tool.uv]
package = false

[tool.carreira-release]
prerelease = true

[dependency-groups]
docs = ["pillow>=11"]
